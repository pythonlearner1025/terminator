<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Audio pass verification</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070d}canvas{display:block;width:100%;height:100%}</style>
<canvas id="game"></canvas>
<script type="module">
const map=await fetch('/api/import-map').then(r=>r.json())
const script=document.createElement('script');script.type='importmap';script.textContent=JSON.stringify(map);document.head.append(script)
const {createGame}=await import('@kite3d/engine')
await import('/files/main.js')
window.evidenceGame=await createGame({base:new URL('/files/',location.href).href,canvas:document.getElementById('game')})
</script></html>
