<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Co-op UI evidence runtime</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070d}
canvas{display:block;width:100%;height:100%}
#fixture-label{position:fixed;bottom:4px;right:15px;z-index:100;font:11px monospace;color:#acc0cc;background:#07121ee8;padding:4px 9px;pointer-events:none}
</style>
<canvas id="game"></canvas><div id="fixture-label">LIVE LOCAL RUNTIME / HEADLESS CAPTURE</div>
<script type="module">
const importMap=await fetch('/api/import-map').then(response=>response.json())
const script=document.createElement('script');script.type='importmap';script.textContent=JSON.stringify(importMap);document.head.append(script)
const {createGame}=await import('@kite3d/engine')
await import('/files/main.js')
// Render on demand in this capture harness so two 1080p clients do not spend
// every animation frame rendering an unchanged menu behind its opaque overlay.
const {GameManager}=await import('/files/scripts/GameManager.script.js')
const start=GameManager.prototype.start
GameManager.prototype.start=function(){this.ctx.viewer.renderEnabled=false;return start.call(this)}
window.evidenceGame=await createGame({base:new URL('/files/',location.href).href,canvas:document.getElementById('game')})
</script>
</html>
